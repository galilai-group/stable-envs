[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-envs"
description = "A batched research-environment library with explicit state, dynamics, variation spaces, and fast state-driven CPU/GPU rendering"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Randall Balestriero" },
  { name = "Sami BuGhanem" },
]
keywords = ["reinforcement-learning", "environments", "rendering", "pytorch", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
  "gymnasium>=1.0",
  "loguru>=0.7",
  "numpy>=1.24",
  "tensordict>=0.6",
  "torch>=2.2",
]

[project.scripts]
stable-envs = "stable_envs.cli:main"

[project.urls]
Homepage = "https://github.com/galilai-group/stable-envs"
Documentation = "https://galilai-group.github.io/stable-envs/"
Issues = "https://github.com/galilai-group/stable-envs/issues"
Source = "https://github.com/galilai-group/stable-envs"

[project.optional-dependencies]
# Family extras declare compatible ranges: any resolution inside them constructs, steps
# and renders the family. Exact pins appear only where the family checks a version itself;
# the versions parity is certified under live in the pin-* dependency groups below.
# Backends remain separate so users do not install CUDA extensions merely to compare
# against an official CPU renderer.
# Classic control needs no package to render; numba adds the compiled CPU renderer (the 2D families share it).
classic = ["numba>=0.60"]
# PushT replay checks this exact Pymunk at construction.
pusht = ["pygame>=2.5", "pymunk==7.2.0", "opencv-python-headless", "shapely", "numba>=0.60"]
# PushT reference checks run against gym-pusht.
pusht-reference = ["gym-pusht"]
# SimplePointMaze's exact cached info.goal image uses Matplotlib Agg.
# Navigation dynamics and the public renderer remain native Torch.
navigation = ["matplotlib>=3.10", "numba>=0.60"]
ogbench = ["mujoco>=3.11,<3.13", "ogbench>=1.2.1,<1.3"]
# Cube/Scene semantics and renderer. Their renderers check these exact MuJoCo, OGBench and
# MuJoCo Warp versions when they render, and the CPU semantics check the OGBench version at
# construction. Other OGBench cells need only the extra above.
ogbench-manipulation = ["ogbench==1.2.1", "mujoco==3.12.0", "dm-control>=1.0.45"]
ogbench-manipulation-gpu = [
  "ogbench==1.2.1",
  "mujoco==3.12.0",
  "dm-control>=1.0.45",
  "mujoco-warp==3.12.0",
  "warp-lang==1.17.0",
]
dmcontrol = ["dm-control>=1.0.44", "mujoco>=3.11,<3.13"]
# GPU DM Control with the TrackCom floor reflection, which needs MuJoCo Warp 3.12. Fetch keeps MuJoCo 3.11;
# without this extra TrackCom renders on 3.11 without the reflection.
dmcontrol-gpu = ["dm-control>=1.0.45", "mujoco>=3.12,<3.13", "mujoco-warp>=3.12,<3.13", "warp-lang>=1.16"]
# gymnasium-robotics 1.4.2's Fetch setters fail with MuJoCo 3.12.
robotics = ["gymnasium-robotics>=1.4.2,<1.5", "mujoco>=3.11,<3.12", "opencv-python-headless"]
# Optional render/data surfaces. nvdiffrast is intentionally not metadata:
# PyPI rejects direct-URL requirements and its CUDA extension needs a matching
# local toolkit. The source install is documented in docs/install.md.
mjwarp = [
  "mujoco>=3.11,<3.13",
  "mujoco-warp>=3.11,<3.13",
  "warp-lang>=1.16",
]
# Official replay-backed Rocket dynamics; GPU rendering also requires nvdiffrast and Triton.
# Rocket checks these exact PyFlyt and pybullet versions at construction. PyFlyt 0.29.0 declares
# numpy<2; the rocket reference profile runs it on numpy 2.5.3.
rocket = ["pillow", "scipy", "PyFlyt==0.29.0", "pybullet==3.2.7"]
# Craftax on CPU; craftax-gpu takes JAX's CUDA 12 build for device="cuda".
craftax = ["craftax>=1.6.1", "jax>=0.4.30"]
craftax-gpu = ["craftax>=1.6.1", "jax[cuda12]>=0.4.30"]
hf = ["datasets>=2.14"]
examples = ["imageio", "imageio-ffmpeg", "opencv-python"]
# No `all` extra: Fetch needs mujoco<3.12, and nvdiffrast cannot be expressed
# as PyPI metadata.
# docs and dev repeat the dependency groups of the same name for pip installs.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.0",
]
dev = [
  "build>=1.2",
  "pre-commit>=4.0",
  "pygame",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "pyyaml>=6",
  "ruff>=0.12",
  "mypy>=1.15",
  "tomli>=2; python_version < '3.11'",
  "twine>=6",
]

[dependency-groups]
test = [
  "pygame",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "pyyaml>=6",
  "tomli>=2; python_version < '3.11'",
]
lint = ["ruff>=0.12", "mypy>=1.15", "pre-commit>=4.0"]
build = ["build>=1.2", "twine>=6"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.0",
]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "build" }]
# torch-cpu keeps Linux jobs off the CUDA wheels; torch-cuda takes PyPI's build.
torch-cpu = ["torch>=2.2"]
torch-cuda = ["torch>=2.2"]
# Reference profiles: the exact versions parity is certified under, Python 3.12 only.
# tests/unit/test_reference_pins.py keeps them equal to tests/helpers/reference/profiles.py::PINS.
pin-classic = [
  "numpy==2.5.3; python_version >= '3.12'",
  "gymnasium==1.3.0; python_version >= '3.12'",
  "pygame==2.6.1; python_version >= '3.12'",
  "numba==0.68.0; python_version >= '3.12'",
]
pin-navigation = [
  "numpy==2.5.3; python_version >= '3.12'",
  "gymnasium==1.3.0; python_version >= '3.12'",
  "matplotlib==3.10.9; python_version >= '3.12'",
  "numba==0.68.0; python_version >= '3.12'",
]
pin-pusht = [
  "numpy==2.2.6; python_version >= '3.12'",
  "gymnasium==1.2.3; python_version >= '3.12'",
  "pymunk==7.2.0; python_version >= '3.12'",
  "pygame==2.6.1; python_version >= '3.12'",
  "numba==0.68.0; python_version >= '3.12'",
]
pin-dmc = [
  "numpy==2.5.3; python_version >= '3.12'",
  "gymnasium==1.3.0; python_version >= '3.12'",
  "dm-control==1.0.45; python_version >= '3.12'",
  "mujoco==3.12.0; python_version >= '3.12'",
]
pin-fetch = [
  "numpy==2.5.3; python_version >= '3.12'",
  "gymnasium==1.3.0; python_version >= '3.12'",
  "gymnasium-robotics==1.4.2; python_version >= '3.12'",
  "mujoco==3.11.0; python_version >= '3.12'",
]
pin-ogbench = [
  "numpy==2.2.6; python_version >= '3.12'",
  "gymnasium==1.2.3; python_version >= '3.12'",
  "ogbench==1.2.1; python_version >= '3.12'",
  "mujoco==3.12.0; python_version >= '3.12'",
  "dm-control==1.0.45; python_version >= '3.12'",
]
pin-rocket = [
  "numpy==2.5.3; python_version >= '3.12'",
  "gymnasium==1.3.0; python_version >= '3.12'",
  "PyFlyt==0.29.0; python_version >= '3.12'",
  "pybullet==3.2.7; python_version >= '3.12'",
]
pin-craftax = [
  "craftax==1.6.1; python_version >= '3.12'",
  "jax==0.11.2; python_version >= '3.12'",
  "jaxlib==0.11.2; python_version >= '3.12'",
]
# GPU add-on, combinable with pin-dmc or pin-ogbench.
gpu-mjwarp = ["mujoco-warp==3.12.0; python_version >= '3.12'", "warp-lang==1.17.0; python_version >= '3.12'"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
conflicts = [
  [{ group = "torch-cpu" }, { group = "torch-cuda" }],
  [
    { group = "pin-classic" },
    { group = "pin-navigation" },
    { group = "pin-pusht" },
    { group = "pin-dmc" },
    { group = "pin-fetch" },
    { group = "pin-ogbench" },
    { group = "pin-rocket" },
    { group = "pin-craftax" },
  ],
  # Fetch needs MuJoCo 3.11; these need 3.12.
  [{ extra = "robotics" }, { group = "pin-dmc" }],
  [{ extra = "robotics" }, { group = "pin-ogbench" }],
  [{ extra = "robotics" }, { group = "gpu-mjwarp" }],
  [{ extra = "robotics" }, { extra = "dmcontrol-gpu" }],
  [{ extra = "robotics" }, { extra = "ogbench-manipulation" }],
  [{ extra = "robotics" }, { extra = "ogbench-manipulation-gpu" }],
  [{ extra = "dmcontrol-gpu" }, { group = "pin-fetch" }],
  [{ extra = "ogbench-manipulation" }, { group = "pin-fetch" }],
  [{ extra = "ogbench-manipulation-gpu" }, { group = "pin-fetch" }],
]

# PyFlyt 0.29.0 declares numpy<2 but runs on 2.5.3 in the rocket reference profile. This
# replaces its metadata for uv only; pip still resolves the rocket extra to numpy<2.
[[tool.uv.dependency-metadata]]
name = "pyflyt"
version = "0.29.0"
requires-dist = ["numba", "numpy", "scipy", "gymnasium", "pettingzoo", "pybullet", "pyyaml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "torch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["stable_envs*"]

[tool.setuptools.dynamic]
version = { attr = "stable_envs.__about__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 119
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "D"]
# E402: late imports are load-bearing (importorskip, optional deps, sys.path, env vars).
# E731: lambda -> def changes __name__ / pickle.
# E741: renaming `l`/`O` is an identifier change, not formatting.
# D1: missing docstrings are not enforced yet; the D rules check the format of existing ones.
ignore = ["E402", "E731", "E741", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the public API only.
"stable_envs/_*/**" = ["D"]
"stable_envs/**/_*.py" = ["D"]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"benchmarks/**" = ["D"]
"examples/**" = ["D"]
"docs/**" = ["D"]
"conftest.py" = ["D"]
"noxfile.py" = ["D"]
# Re-exports and registration side-effect imports.
"**/__init__.py" = ["F401"]
# Generated MJWarp kernels: `int()` casts are load-bearing for Warp.
"stable_envs/render/mjwarp/__init__.py" = ["UP018"]
# Public `Union[...]` alias; `|` would change the runtime type object.
"stable_envs/render/scene.py" = ["UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, CPU-only, no reference package and no device",
  "integration: several components together (env + renderer + registry)",
  "regression: the frozen regression oracle — corpora, digests, support matrix",
  "gpu: requires a CUDA device (skipped otherwise)",
  "reference: requires the official reference env to be installed",
  "slow: long-running throughput benchmark",
  "nightly: heavy source comparison; CI runs it on main and nightly, not on pull requests",
  "smoke: one env per family; the fast pre-commit subset (python -m tests._runner.supervisor --smoke)",
  "selftest: deliberately crashes the interpreter; skipped unless SE_SELFTEST_CRASH=1",
]
