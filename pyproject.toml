[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-envs"
description = "A batched research-environment library with explicit state, dynamics, variation spaces, and fast state-driven CPU/GPU rendering"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Randall Balestriero" },
  { name = "Sami BuGhanem" },
]
keywords = ["reinforcement-learning", "environments", "rendering", "pytorch", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
  "gymnasium>=1.0",
  "loguru>=0.7",
  "numpy>=1.24",
  "tensordict>=0.6",
  "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/galilai-group/stable-envs"
Documentation = "https://galilai-group.github.io/stable-envs/"
Issues = "https://github.com/galilai-group/stable-envs/issues"
Source = "https://github.com/galilai-group/stable-envs"

[project.optional-dependencies]
# Family extras. Backends remain separate so users do not install CUDA
# extensions merely to compare against an official CPU renderer.
pusht = ["pygame", "pymunk==7.2.0", "opencv-python-headless", "shapely"]
# Historical gym-pusht corpus checks use their own reference environment.
pusht-reference = ["gym-pusht"]
# SimplePointMaze's exact cached info.goal image uses Matplotlib Agg.
# Navigation dynamics and the public renderer remain native Torch.
navigation = ["matplotlib>=3.10"]
ogbench = ["mujoco>=3.11,<3.13", "ogbench==1.2.1"]
# Cube/Scene unified semantic + renderer profile. Other OGBench cells retain their extra above.
ogbench-manipulation = ["ogbench==1.2.1", "mujoco==3.12.0", "numpy==2.2.6", "gymnasium==1.2.3", "dm-control==1.0.41"]
ogbench-manipulation-gpu = ["ogbench==1.2.1", "mujoco==3.12.0", "numpy==2.2.6", "gymnasium==1.2.3", "dm-control==1.0.41", "mujoco-warp==3.12.0", "warp-lang==1.17.0"]
craftax = ["craftax", "jax"]
# Audited registered Craftax semantics; legacy atlas renderer extra remains separate.
craftax-semantics = ["craftax==1.5.0", "jax==0.10.1", "jaxlib==0.10.1", "flax==0.12.7", "gymnax==0.0.9", "numpy==2.2.6", "chex==0.1.92", "gymnasium==1.2.3", "torch==2.14.0", "tensordict==0.14.2"]
craftax-semantics-gpu = ["craftax==1.5.0", "jax[cuda12]==0.10.1", "jaxlib==0.10.1", "flax==0.12.7", "gymnax==0.0.9", "numpy==2.2.6", "chex==0.1.92", "gymnasium==1.2.3", "torch==2.14.0", "tensordict==0.14.2"]
dmcontrol = ["dm-control>=1.0.44", "mujoco>=3.11,<3.13"]
# gymnasium-robotics 1.4.2's Fetch setters fail with MuJoCo 3.12.
robotics = ["gymnasium-robotics", "mujoco>=3.11,<3.12", "opencv-python-headless"]
# Optional render/data surfaces. nvdiffrast is intentionally not metadata:
# PyPI rejects direct-URL requirements and its CUDA extension needs a matching
# local toolkit. The source install is documented in docs/install.md.
mjwarp = [
  "mujoco>=3.11,<3.13",
  "mujoco-warp>=3.11,<3.13",
  "warp-lang>=1.16",
]
# Official replay-backed Rocket dynamics; GPU rendering also requires nvdiffrast and Triton.
rocket = ["pillow", "scipy", "PyFlyt==0.29.0", "pybullet==3.2.7", "numpy==2.5.3", "gymnasium==1.3.0"]
hf = ["datasets>=2.14"]
examples = ["imageio", "imageio-ffmpeg", "opencv-python"]
# No `all` extra: Fetch needs mujoco<3.12, and nvdiffrast cannot be expressed
# as PyPI metadata.
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.0",
]
dev = [
  "build>=1.2",
  "pre-commit>=4.0",
  "pygame",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "pyyaml>=6",
  "ruff>=0.12",
  "mypy>=1.15",
  "tomli>=2; python_version < '3.11'",
  "twine>=6",
]

[tool.setuptools.packages.find]
include = ["stable_envs*"]

[tool.setuptools.dynamic]
version = { attr = "stable_envs.__about__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 119
extend-exclude = ["docs/assets", "docs/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# E402: late imports are load-bearing (importorskip, optional deps, sys.path, env vars).
# E731: lambda -> def changes __name__ / pickle.
# E741: renaming `l`/`O` is an identifier change, not formatting.
ignore = ["E402", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Re-exports and registration side-effect imports.
"**/__init__.py" = ["F401"]
# Generated MJWarp kernels: unused typing imports and `int()` casts are load-bearing for Warp.
"contrib/render/lightspec.py" = ["UP006", "UP018", "UP035"]
"stable_envs/render/mjwarp/__init__.py" = ["UP018"]
# Forward references kept unimported to avoid cycles; annotations are not evaluated.
"stable_envs/env.py" = ["F821"]
"stable_envs/envs/dmcontrol/suite.py" = ["F821"]
# Public `Union[...]` alias; `|` would change the runtime type object.
"stable_envs/render/scene.py" = ["UP007"]
# Measured `"%04i" % reward` atlas keys / pygame font contract.
"contrib/carracing.py" = ["UP031"]
"examples/robocasa_visual/calibrate_tier.py" = ["UP031"]
# Lambdas close over names `del`'d in the same function; ruff treats them as unbound.
"examples/bench_gpu_vs_cpu.py" = ["F821"]
"examples/domain_randomization.py" = ["F821"]
# Availability probe: `import torch` inside try/except ImportError.
"examples/render.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, CPU-only, no reference package and no device",
  "integration: several components together (env + renderer + registry)",
  "regression: the frozen regression oracle — corpora, digests, support matrix",
  "gpu: requires a CUDA device (skipped otherwise)",
  "reference: requires the official reference env to be installed",
  "slow: long-running throughput benchmark",
  "smoke: one env per family; the fast pre-commit subset (scripts/run_smoke_tests.sbatch)",
  "selftest: deliberately crashes the interpreter; skipped unless SE_SELFTEST_CRASH=1",
]
