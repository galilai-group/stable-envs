# Copied verbatim from le-wm/config/eval/pusht.yaml, plus `renderer` and an output dir/tag.
# Every number that can move the success rate is theirs.
defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random

# official | stable_envs | stable_envs_resize512
renderer: official

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  dir: ${hydra:runtime.cwd}/results
  filename: pusht_results_${renderer}.txt
  tag: seed${seed}_n${eval.num_eval}_off${eval.goal_offset_steps}

hydra:
  run:
    dir: ${hydra:runtime.cwd}/logs/hydra/${now:%Y%m%d_%H%M%S}
