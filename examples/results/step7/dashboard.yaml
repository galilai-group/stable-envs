- date: '2026-09-15'
  from: W1 / coordinator
  topic: CraftaxClassic registered-default CPU tier and the speed-ratio reference
  facts: 'Mixed-corpus CPU tier on the NO_REFERENCE ladder = CPU_REGRESSION (cores_cpu 0.263; daylight alone 24.2). The frozen ladder prefers S_cpu when a reference exists; the parity reference is the un-jitted
    craftax renderer (2.18 f/s), so S_cpu would read 528x and certify CPU_EXCEPTIONAL on a renderer nobody runs; against the jitted official S_cpu ~1.9x (still < 5). W2 adds: CraftaxPixels un-jitted 2.98
    vs jitted 1,516 f/s (509x); W1''s un-jitted reference_env already moved Classic''s Step-3 denominator (1,046 -> 4.62 f/s), so any Step-3 re-run on integration inflates Classic''s S_cpu ~450x. Coordinator
    note: the harness may need a separate ''speed reference'' hook from the parity reference (Step 8). W1 GPU proof: on one 3090 in one job the Step-6 tree (1,174,913 f/s, jitted ref 386.7) labels GPU_FAST
    while the branch (46,187 f/s, un-jitted ref 1.6) labels GPU_EXCEPTIONAL; a 25x slower renderer labels one rung higher from the reference alone. The trap is live on both devices today.'
  question: '(1) Accept CPU_REGRESSION as the honest registered-default CPU tier for CraftaxClassic in Step 7 (coverage change, not a renderer regression; daylight diagnostic recorded)? (2) For S_cpu, which
    reference may a speed ratio use: the parity reference as written (un-jitted) or the official as a user runs it (jitted)? Coordinator recommendation: (1) yes; (2) speed ratios use the official as a user
    runs it, parity uses the reference as written; until Step 8 encodes that in the harness, CraftaxClassic''s CPU tier is taken on the NO_REFERENCE ladder with S_cpu suppressed and both numbers recorded.
    This touches the Step-2 taxonomy, so it is Sami''s call (Step 8 candidate).'
  status: open
  also: 'W2 CraftaxPixels: check_resolution_consistency not applicable in ALL bands on the official''s own evidence (broader scope than Classic''s band ruling); authorized by precedent, Sami may override.'
  recommendation_update: Record CraftaxClassic's tiers from the NO_REFERENCE row (CPU_REGRESSION / GPU_FAST) for Step 7; Step 8 gives the harness a speed-reference hook distinct from the parity reference
    (jitted official as a user runs it).
