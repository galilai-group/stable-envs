decisions:
- date: '2026-09-15'
  by: Sami
  topic: Manipulator dead dims
  decision: 'APPROVED narrow per-class exclusion for ball_y, target_ball_quat_qw, target_ball_quat_qy: render-invariant because the geometry is spherical. Scope only to the spherical class where invariance
    is established; document the geometric reason; regression test that excluded dims leave pixels unchanged; the same dims must still matter for non-spherical geometry (box shape). Render-contract exception,
    not a relaxation of state_dims_matter. Do not record a renderer FAIL for a dim mathematically incapable of changing the image.'
- date: '2026-09-15'
  by: Sami
  topic: CraftaxClassic night resolution-consistency
  decision: Run one oracle experiment on the official Craftax renderer (same night state, same PRNG, both check resolutions, same box-downsample protocol). If the official is itself not resolution-consistent
    under night (noise field intrinsically resolution-dependent) mark check_resolution_consistency not applicable for the night band with that result as justification; if it is consistent, derive and enforce
    a night-specific bound with the existing provenance discipline. No weakened or invented bound. Exact parity at each supported resolution remains required.
- date: '2026-09-15'
  by: Sami
  topic: CraftaxClassic performance tier
  decision: ONE registered/default certification tier from mixed-corpus throughput; no separate daylight/night env tiers. Report mixed (tier), daylight-only (diagnostic), night-only (diagnostic), the daylight/night
    ratio, and flag the slower band. Mixed benchmark uses the frozen Step-2 protocol's state corpus/distribution if specified, else a documented reproducible distribution representative of the registered
    default.
- date: '2026-09-15'
  by: Sami
  topic: Step 7 continuation
  decision: Continue W1/W3 fix-ups and merge after review gates; continue W2/W5/W6; shared renderer work prefers generic capabilities (nvdiff triangle scenes, per-row material/colour, shared primitives)
    over env-specific hacks.
- date: '2026-09-15'
  by: Sami
  topic: W6 PFRocketLanding review handling
  decision: 'Keep the current architecture and shared nvdiff extensions (review supports them; no redesign). RC-1 and RC-2 are hard blockers (float64 quaternion normalisation + float32-aware equivalence
    check; re-run the exact measure_tier 64-state seed and the 100-state corpus check; reference_render must not reject converged states; fidelity job checkpoints). RC-3 before interpreting any performance
    certification (exclude B=1; BATCH_SCALES cap per frozen contract; measure cpu_frac/HOST_BOUND; reuse Step-6 provenance machinery; pin the one-core JPEG comparator; record threads/load/host/job/SHA;
    never mix local-M5 and same-node numbers). RC-4/RC-5 now. Then rerun the independent reviewer. Only then run/accept the cluster gates: six locomotion nvdiff cells byte identity on the same GPU; first
    successful PFRocketLanding render; full fidelity + under-variation; corpus replay; mandatory conformance incl. velocity/state dims; GPU sweep + qualifiers; DIRECT+EGL+CUDA coexistence. No merge until
    reviewer APPROVE and cluster gates pass.'
- date: '2026-09-15'
  by: Sami
  topic: Overnight autonomy for Step 7
  decision: 'Coordinator authorized to: implement reviewer fixes that do not change frozen contracts/scope; rerun independent review; submit/retry Oscar jobs; merge on reviewer APPROVE + mandatory gates;
    start queued workstreams as slots free; resolve additive merge conflicts; update the dashboard continuously. Priorities: CraftaxClassic merge; CraftaxPixels; Manipulator; Quadruped; PFRocketLanding
    (keep architecture; merge only on APPROVE + cluster gates); OGBCube/OGBScene as far as evidence permits. Escalate and stop only for: frozen-contract change; new broad Gate-A exception; material shared-architecture
    change; fidelity weakening to pass; scope change; classifying an SWM env as fundamentally unsupported. Blocked workstream -> record the falsifiable blocker, reuse the slot. No Step 8 until Step 7 is
    complete or a demonstrated blocker needs Sami.'
