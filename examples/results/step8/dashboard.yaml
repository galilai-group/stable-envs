decisions:
- date: '2026-09-16'
  by: Sami
  topic: check_colors_apply_exactly
  ruling: literal RGB equality inapplicable for style leaves whose official renderer applies a known lighting/material law making equality unreachable, demonstrated against the official renderer and scoped
    narrowly; a law-aware comparison may be added as a successor check but is not retroactively part of the frozen Step-2 mandatory contract; record mechanism and evidence
- date: '2026-09-16'
  by: Sami
  topic: feasible unmapped leaves
  ruling: do not classify a semantically required SWM leaf unsupported merely because a renderer change is needed; aggregate A/B/C evidence; if several families need the same per-world model-array capability
    implement one minimal shared capability; no one-off hacks
- date: '2026-09-16'
  by: Sami
  topic: CraftaxClassic corpora
  ruling: keep both; Step-4 corpus remains the historical world-row oracle (zero-extension), Step-7 corpus certifies the full 149-dim observation; no retirement or re-freeze
