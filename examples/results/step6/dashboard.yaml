decisions:
- date: '2026-09-14'
  by: Sami
  decision: 'CPU 3-D backend work APPROVED. Policy: backend implementation may differ by device, renderer semantics may not; CPU backend certified against the same frozen contract; no MJWarp-on-CPU for
    symmetry; one shared CPU-native backend for the MJWarp-only scenes (Fetch if feasible), no bespoke per-env approximations; device="cpu" must be a genuine CPU backend, never silent CUDA fallback; minimize
    coupling toward a later Scene3D extraction without blocking Step 6; Fetch CPU feasibility to be quantified before a large implementation.'
- date: '2026-09-15'
  by: coordinator
  decision: Certification partition cannot provide a sole-tenant CPU node under the normal QOS (cpu=64 cap vs whole-node exclusive charge); 1-thread cores_cpu shards with a same-node decode bar are not
    obtainable there for gfxdraw. S_cpu rows stand; cores_cpu left unasserted rather than borrowed. Needs a QOS with a node-sized CPU cap or free 48-core nodes (escalate to Sami / Step 8).
- date: '2026-09-15'
  by: Sami
  decision: 'MERGE 5402387 (Walker downsample protocol): the frozen DOWNSAMPLE_EXACT_FRAC bounds were measured on the 8-state STATE_SEED protocol; the certifier judges on that protocol, no threshold/margin
    change, the 64-state corpus number stays reported diagnostically.'
- date: '2026-09-15'
  by: Sami
  decision: 'Report scope: correctness/fidelity accounting over all 49 render-distinct cells; CPU/GPU performance completion over registered/default configurations only (Step 2 §4.2, §12.2); parameter-space
    cells are not performance blockers.'
- date: '2026-09-15'
  by: Sami
  decision: Authorize RAYCAST-6 (Pointmaze composite rewrite) and SWMNAV-2 (shared swm_nav GPU kernel for the four registered/default GPU_FASTER rows).
- date: '2026-09-15'
  by: Sami
  decision: 'Fetch GPU CLOSED as a demonstrated blocker. Do not fund the ~2x MJWarp megakernel effort in Step 6. Recorded explicitly: at B>=64 the per-frame cost is flat (212 us at B=64, 192 us at B=4096);
    the BATCH_SCALES failure (9.5x vs 20x) is compute-bound per-frame arithmetic (device 98.9% of wall, megakernel 90.5% of device) against a fixed ~1.48 ms B=1 host cost, not a failure to batch. R 5.3-6.7
    and cores 4.1-5.4 pass.'
- date: '2026-09-15'
  by: Sami
  decision: Fetch CPU CLOSED as a demonstrated blocker under the current parity contract (31,720 sub-pixel triangles at 480 px; culled span rasteriser 135 ns/tri vs 36-41 required; triangle setup alone
    60-68% of the budget; mesh decimation inadmissible). No further CPU optimisation.
- date: '2026-09-15'
  by: Sami
  decision: 'Do NOT change the frozen CPU_FAST / cores_cpu>=1 criterion in Step 6. Recorded: the decode conjunct still enforces the intended regeneration-vs-storage economic claim (one-core JPEG-q90 decode
    is stable at 6.4-7.6k fps for 84 px across nodes); but S_cpu>=5 no longer approximates that break-even on the llvmpipe certification host (decode/official = 200-700 for the DMC cells vs the Step-2 anchor
    median of 5.04). Any policy change is an explicit later decision.'
- date: '2026-09-15'
  by: Sami
  decision: 'Deferred, not exhausted: gfxdraw per-environment GPU specialisation (R 303-398 vs 500); SIMD CPU-3D whole-frame kernel (M2); direct-write span/scanline CPU rasterisers for Scene2D/swm_nav/gfxdraw
    (named, not costed on hardware); fused compiled raycast cast (12x measured, not bit-exact on gcc/x86).'
- date: '2026-09-15'
  by: Sami
  decision: 'Close-out rule: after Walker + Pointmaze composite + swm_nav kernel land through the normal gates, close Step 6 as ENGINEERING COMPLETE WITH DOCUMENTED CERTIFICATION BLOCKERS; never claim the
    frozen Step-2 performance contract is fully satisfied where it is not; then prepare the Step-7 launch state and report the remaining registered/default certification blockers separately.'
