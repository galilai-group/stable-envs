site_name: stable-envs
site_description: A batched environment library with explicit state, dynamics, variation, and fast state-driven rendering
repo_url: https://github.com/galilai-group/stable-envs
repo_name: galilai-group/stable-envs
site_url: https://galilai-group.github.io/stable-envs/
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  logo: assets/brand/mark.svg
  favicon: assets/brand/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - toc.follow
  font: false

# Anchors and links are validated. omitted_files stays at its default (info).
validation:
  links:
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn

# Built, but not listed individually.
not_in_nav: |
  api/style.md
  api/scene.md
  api/gfxdraw.md
  api/spaces.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

hooks:
  - docs/_hooks.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: null
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2
            filters: ["!^_"]

nav:
  - User guide:
      - Home: index.md
      - Quickstart: quickstart.md
      - Install: install.md
      - Environments: environments.md
      - State, Variation, Frame: concepts/state.md
      - Stateful vs functional: concepts/dynamics.md
      - Variations: concepts/variation-spaces.md
      - Lifecycle: concepts/lifecycle.md
      - Limitations: concepts/limitations.md
      - Sibling projects: concepts/worldmodel.md
      - Benchmarks: benchmarks.md
      - Gallery: gallery.md
  - Contributor:
      - Adding a component: adding/index.md
      - Environment backend: adding/environment.md
      - Task or registration: adding/task.md
      - Renderer: adding/renderer.md
      - Previous contributor URL: adding-an-env.md
      - Testing: testing.md
      - Fidelity methodology: concepts/fidelity-methodology.md
      - Fidelity tiers: concepts/fidelity-tiers.md
      - The Scene2D IR: concepts/scene-ir.md
      - The fused rasterizer: concepts/rasterizer.md
      - 2D raster backends: api/raster2d.md
      - Analytic raycast and CPU3D: api/raycast3d.md
      - Triangle rendering: api/nvdiff.md
      - MJWarp rendering: api/mjwarp.md
      - Writing a bit-exact Triton kernel: concepts/bit-exact-triton.md
      - Why physics is separate: concepts/physics.md
      - Env: api/env.md
      - Registered environments: api/envs.md
      - Sibling projects (API): api/compat.md
      - testing: api/testing.md
