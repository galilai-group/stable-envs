site_name: stable-envs
site_description: A batched environment library with explicit state, dynamics, variation, and fast state-driven rendering
repo_url: https://github.com/galilai-group/stable-envs
repo_name: galilai-group/stable-envs
site_url: https://galilai-group.github.io/stable-envs/
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  logo: assets/brand/mark.svg
  favicon: assets/brand/mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - toc.follow
  font: false

# Anchors and links are validated. omitted_files stays at its default (info).
validation:
  links:
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn

# The hook reads the snapshots from disk; the site does not publish them.
exclude_docs: |
  environments/_data/

extra_css:
  - assets/stylesheets/envs.css

# Built, but not listed individually.
not_in_nav: |
  api/style.md
  api/scene.md
  api/gfxdraw.md
  api/spaces.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

hooks:
  - docs/_hooks.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2
            filters: ["!^_"]

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - System setup: system-setup.md
      - Quickstart: quickstart.md
      - Performance tuning: performance-tuning.md
      - Environment variables: environment-variables.md
  - Concepts:
      - State, Action, Variation and Frame: concepts/state.md
      - Stepping: concepts/dynamics.md
      - Variations: concepts/variation-spaces.md
      - Lifecycle: concepts/lifecycle.md
      - Limitations: concepts/limitations.md
      - Sibling projects: concepts/worldmodel.md
  - Environments:
      - Overview: environments.md
      - Classic control: environments/classic-control.md
      - Craftax: environments/craftax.md
      - DM Control: environments/dmcontrol.md
      - Fetch: environments/fetch.md
      - Navigation: environments/navigation.md
      - OGBench: environments/ogbench.md
      - PushT: environments/pusht.md
      - PyFlyt: environments/pyflyt.md
  - Reference:
      - Env: api/env.md
      - Registered environments: api/envs.md
      - Command line: api/cli.md
      - Testing helpers: api/testing.md
      - 2D raster rendering: api/raster2d.md
      - Analytic raycast and CPU3D: api/raycast3d.md
      - Triangle rendering with nvdiffrast: api/nvdiff.md
      - MJWarp rendering: api/mjwarp.md
  - Benchmarks: benchmarks.md
  - Contributing:
      - Adding a component: adding/index.md
      - Adding an environment backend: adding/environment.md
      - Adding a task: adding/task.md
      - Adding a renderer: adding/renderer.md
      - Writing a bit-exact Triton kernel: adding/bit-exact-triton.md
      - Testing: testing.md
      - Internals:
          - Fidelity methodology: concepts/fidelity-methodology.md
          - Why physics is separate: concepts/physics.md
          - The Scene2D IR: concepts/scene-ir.md
  - Changelog: changelog.md
