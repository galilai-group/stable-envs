      - LunarLander: research/lunarlander.md
      - MiniGrid and BabyAI: research/minigrid.md
      - Crafter: research/crafter.md
      - OGBench mazes: research/ogbench.md
      - D4RL maze2d / PointMaze: research/maze2d.md
      - Overcooked (JaxMARL): research/overcooked.md
      - Griddly: research/griddly.md
      - Sokoban and Boxoban: research/sokoban.md
      - CarRacing: research/carracing.md
      - highway-env: research/highway.md
      - Jumanji: research/jumanji.md
      - PGX board games: research/pgx.md
      - Pixel-native families: research/pixel_native.md
      - GPU-native families: research/gpu_native.md
      - RoboCasa: research/robocasa.md
      - DM Control: research/dmcontrol.md
      - Fetch (gymnasium-robotics): research/fetch.md
      - Gymnasium MuJoCo: research/mujoco_locomotion.md
      - Meta-World: research/metaworld.md
      - HumanoidBench: research/humanoidbench.md
      - Choosing a 3-D backend: research/backend3d.md
      - nvdiffrast backend: research/nvdiffrast.md
      # The matrix is GENERATED (scratch/swm_matrix.py) and is the current answer to "what is
      # covered"; the older note keeps the per-family investigation and the reasoning behind each
      # gap, which no generator can produce. Listed first because it is the one that cannot drift.
      - stable_worldmodel coverage matrix: research/swm_matrix.md
      # Frozen policy, not a measurement: the thresholds an env must clear to be called finished,
      # chosen from the committed benchmark corpus BEFORE the fresh 3090/M5 sweep so a result cannot
      # move the bar it is judged against. scratch/certification.json is the machine-readable copy.
      - 'Certification: what "done" means': research/certification.md
      # GENERATED (scratch/step3/certify.py) from the raw shards under examples/results/step3/.
      # Measurements only: every label in it is computed from the frozen certification.json, so
      # this page can disagree with the bar but can never move it.
      - 'Step 3: the implementation measured': research/step3_benchmarks.md
      # GENERATED (scratch/step4/certify.py) from the raw shards under examples/results/step4/.
      # Gate A per render-distinct configuration, and the frozen state corpora a Step 6 rewrite is
      # replayed against. Every bound on the page is extracted from the test module that declares it.
      - 'Step 4: the fidelity baseline': research/step4_fidelity_baseline.md
      # GENERATED (scratch/step5/report.py) from examples/results/step5/. The paired renderer-swap
      # experiment: same checkpoint, same episodes, same planner, only render() differs -- judged by
      # the equivalence rule Step 2 froze before any of these numbers existed.
      - 'Step 5: downstream semantics': research/step5_downstream_semantics.md
      # GENERATED (scratch/step6/report.py) from examples/results/step6/, the coordinator dashboard,
      # and the frozen Step 3 labels + Step 4 certification. Per-workstream evidence, the 49 frozen
      # configurations carried forward with a source cited per cell, and the section-25 counts summed
      # over that table. IN PROGRESS: workstreams are still merging, so the page prints what has NOT
      # been done -- and where the dashboard and a committed artifact disagree -- as plainly as what
      # has. Re-run it after every merge; it needs no edit to pick one up.
      - 'Step 6: optimisation (in progress)': research/step6_optimization.md
      # GENERATED (scratch/step7/report.py) from examples/results/step7/, the coordinator dashboard
      # and examples/results/step7/closure/coverage_matrix.json. The closure answer to "which
      # stable_worldmodel environment can we render, at what fidelity tier, with which Gate-A
      # verdict, on which device" -- one row per registered swm id, with the merge commit that
      # landed each cell. Re-run it after every merge; it needs no edit to pick one up.
      - 'Step 7: renderer coverage closure': research/step7_coverage.md
      # Step 8 Workstream C. Every stable_worldmodel variation leaf offered by the Step-7 new
      # cells and the OGB / Rocket / maze families, classified mapped / unsupported / dead upstream /
      # not applicable, each verdict carrying the measurement it rests on. The per-leaf tables are
      # generated (scratch/step8/variations-newcells/generate_report.py) rather than written.
      - 'Step 8: variation maps (new cells)': research/step8_variations_newcells.md
      # Step 8, Workstream E. Two pages, both GENERATED or evidence-backed rather than written:
      # step8_support_matrix.md is regenerated by `python scratch/step8/report.py` from committed
      # artifacts and must not be hand-edited; step8_certification.md is the harness/provenance
      # findings behind it.
      - 'Step 8: certification harness and provenance': research/step8_certification.md
      - 'Step 8: support matrix (42 ids)': research/step8_support_matrix.md
      # Workstream F: which reference version each fidelity claim is certified against, the
      # 3.12 drift that is recorded beside it, the 3.13 bump evaluation, and the Antmaze
      # bake classification. Artifacts: examples/results/step8/provenance/.
      - 'Step 8: reference versions and provenance': research/step8_reference_provenance.md
      # Step-8 Workstream A. Every stable_worldmodel variation leaf of the five classic-control
      # and twelve DM Control ids, classified mapped / unsupported / dead upstream / not
      # applicable, with the measurement behind each class; generated tables from
      # examples/results/step8/variations-dmc-control/leaf_classification.json.
      - 'Step 8: variation maps (DMC + classic control)': research/step8_variations_dmc_control.md
      # Step-8 Workstream H. Why the Craftax semantic follow-up returns a FINDING rather than a
      # Gate-H run: both cells are byte-identical to the official renderer (re-measured on that
      # branch), and stable_worldmodel ships no Craftax checkpoint, corpus, planner config or
      # success criterion. Evidence in examples/results/step8/semantic/.
      - 'Step 8: Craftax semantic follow-up': research/step8_semantic_craftax.md
      # Step-8 coordinator checkpoints: the weekly-limit handoff and the Codex takeover stop note.
      - 'Step 8: handoff checkpoint': research/step8_handoff.md
      - 'Step 8: takeover stop note': research/step8_takeover_stop_handoff.md
      # Step 8, Workstream B. The leaf-by-leaf account of how the twelve swm/Fetch*-v3 variation
      # spaces relate to ours: mapped, unsupported, dead upstream or state. Its numbers live in
      # examples/results/step8/variations-fetch/.
      - 'Step 8: Fetch variation maps': research/step8_variations_fetch.md
      # Step 8, Workstream G. The final CPU/GPU tier accounting for all 42 ids and the
      # production-pipeline claim kept separate from it. Generated by
      # `python scratch/step8/perf/build_performance.py && python scratch/step8/perf/write_doc.py`
      # from committed Step-6/Step-7 artifacts; nothing on it was re-measured and it must not be
      # hand-edited.
      - 'Step 8: performance and pipeline accounting': research/step8_performance.md
      # Step 8, Workstream D. The Gate-F/SWM-API matrix for all 42 ids, generated by
      # `python scratch/step8/swm/build_gate_f.py` from committed Step-7/Step-8 evidence (never
      # hand-edited), plus the consolidated upstream findings bundle it points at.
      - 'Step 8: SWM integration / Gate F matrix': research/step8_swm_integration.md
      - 'Step 8: SWM/upstream findings bundle': research/step8_upstream_findings.md
      - stable_worldmodel coverage (notes): research/swm_coverage.md
      # The NO-GO notes. They are the reason a family is ABSENT from the registry, which is a question
      # readers ask far more often than "why is this one here" -- and until now all three of them were
      # orphaned: built by mkdocs, linked from nothing, findable only by guessing the URL.
      - 'NO-GO: Adroit hand': research/adroit.md
      - 'NO-GO: Franka Kitchen': research/kitchen.md
      - 'NO-GO: MiniWorld': research/miniworld.md
