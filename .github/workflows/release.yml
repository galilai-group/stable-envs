name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import runpy; print(runpy.run_path('stable_envs/__about__.py')['__version__'])")"
          test "$tag" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scratch/step9/packaging-ci/audit_dist.py dist
      - name: Smoke-test wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python scratch/step9/packaging-ci/smoke_installed.py
      - name: Smoke-test source distribution
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/python scratch/step9/packaging-ci/smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/stable-envs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      # PyPI Trusted Publishing supplies the short-lived credential. No API
      # token or repository secret is stored in this workflow.
      - uses: pypa/gh-action-pypi-publish@release/v1
