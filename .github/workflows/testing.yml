name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mujoco-locomotion]"
      - name: Run unit tests
        run: |
          python -m pytest tests/unit -m unit -q
          python -m pytest tests/contracts/test_saved_native.py tests/regression/test_testing_migration.py -q
          python -m pytest tests/packaging/test_distribution.py -q

  # Intentional dependency-interaction check: unit + integration under the
  # MuJoCo extra set, not a second copy of the unit job's interpreter.
  integration:
    name: unit + integration under MuJoCo profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MuJoCo profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mujoco-locomotion]"
      - name: Run unit and integration tests
        shell: bash
        run: |
          paths=(tests/unit)
          if [[ -d tests/integration ]]; then
            paths+=(tests/integration)
          fi
          python -m pytest "${paths[@]}" -m "unit or integration" -q

  package:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/ci/audit_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    name: install ${{ matrix.distribution }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install and smoke-test distribution
        shell: bash
        run: |
          python -m venv .dist-venv
          if [[ "${{ matrix.distribution }}" == "wheel" ]]; then
            artifact=(dist/*.whl)
          else
            artifact=(dist/*.tar.gz)
          fi
          .dist-venv/bin/python -m pip install --upgrade pip
          .dist-venv/bin/python -m pip install "${artifact[0]}"
          .dist-venv/bin/python scripts/ci/smoke_installed.py

  regression-cpu:
    name: CPU regression (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run lightweight CPU regression
        env:
          MUJOCO_GL: osmesa
          STABLE_ENVS_CI_PROFILE: core
          SE_SKIP_NODE_GATE: "1"
        run: >-
          python -m pytest
          -m "regression and not gpu"
          -q --tb=line

  macos-core:
    name: macOS core smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: device=auto smoke
        env:
          SE_SKIP_NODE_GATE: "1"
        run: python scripts/ci/smoke_macos.py
      - name: Small unit selection
        env:
          SE_SKIP_NODE_GATE: "1"
        run: >-
          python -m pytest
          tests/unit/test_public_api.py
          tests/unit/test_state.py
          -q --tb=line
