name: Documentation
description: Something in the docs is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The page URL or file path, for example `docs/quickstart.md`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, unclear or missing.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: What the page should say instead, if you know.
