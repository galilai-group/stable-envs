      <path transform="translate(39.0,33.0) rotate(22.0)" d="M-12.50,-15.62 h25.00 v6.25 h-9.38 v25.00 h-6.25 v-25.00 h-9.38 Z" fill="#8FA3B8" stroke="#778899" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="26.5" cy="46.5" r="6.0" fill="#4169E1"/>
    </g>
    <rect x="17.0" y="9.5" width="45.0" height="45.0" rx="7" fill="none" stroke="#778899" stroke-width="3.2"/>
  </g>
